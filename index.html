<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Pin Leveler</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--tx:#e8edf3;--mut:#8b97a7;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:18px;margin:0}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}.dots i.done{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 6px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
button,select,input,textarea{font:inherit;color:var(--tx);background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button{cursor:pointer;background:#1f2733}
button.pri{background:var(--acc);color:#04111f;border:0;font-weight:700}
button.ok{background:var(--ok);color:#03150a;border:0;font-weight:700}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.row.fit>*{flex:0 0 auto}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
label input,label select,label textarea{width:100%;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.read div{background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:8px}
.read b{display:block;font:700 34px/1.1 ui-monospace,Menlo,monospace}
.read small{color:var(--mut)}
.good{color:var(--ok)}.near{color:var(--warn)}.far{color:var(--bad)}
.bubble{position:relative;width:200px;height:200px;margin:10px auto;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,#0b0f14 0,#0b0f14 100%)}
.bubble:before,.bubble:after{content:"";position:absolute;background:var(--line)}
.bubble:before{left:50%;top:0;bottom:0;width:1px}.bubble:after{top:50%;left:0;right:0;height:1px}
.bubble .t{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border:2px solid var(--ok);border-radius:50%}
.bubble .d{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:var(--warn);transition:background .2s}
.bubble .d.good{background:var(--ok)}.bubble .d.far{background:var(--bad)}
.guide{font-size:18px;font-weight:600;padding:10px 12px;border-radius:12px;background:#0b0f14;border:1px solid var(--line);min-height:70px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--ok)}
.chip{display:inline-block;margin:3px 4px 0 0;padding:6px 10px;border-radius:999px;background:#1f2733;border:1px solid var(--line);font-size:13px;cursor:pointer}
ol,ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
.sim{border:1px dashed var(--warn)}
a{color:var(--acc)}
.tag{font-size:12px;color:var(--warn)}
.leg{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:#0b0f14}
.leg.lk{border-color:var(--bad)}.leg button{margin:4px 2px 0;padding:6px 8px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- version ---------- */
// Every change: bump VERSION + BUILD_DATE and add a new FIRST entry to CHANGELOG.
// The update checker regex-matches the first VERSION declaration below, so keep that exact form
// and do not write that declaration anywhere earlier in the file (comments included).
const VERSION="1.9.6";
const BUILD_DATE="2026-11-09";
const CHANGELOG=[
 ["1.9.6","2026-11-09","Voice, Beep, Progress tones and Sensor tick switches now respond right away: turning Voice on says \"Voice on\", turning it off cuts off any speech in progress, and the sound switches play a short sample."],
 ["1.9.5","2026-11-09","Sensor start race fix: if no motion data has arrived, the app now re-attaches its sensor listeners every second (and on focus, visible and tap) until data flows, so a page that needed a reload to find the sensor now finds it on its own."],
 ["1.9.4","2026-11-09","The Roll only / Pitch only / Both switch is now also on the Calibrate, Roll, Pitch and Verify screens and takes effect immediately (it skips to the right step). New progress bar on Roll and Pitch shows how far you've come since the step started. The live display can no longer freeze if one update fails."],
 ["1.9.3","2026-11-08","Sensor test sign check is now: A. flat, B. top edge raised, C. right edge raised (was right edge lowered). Roll is judged by whether the reading falls when the right edge is raised."],
 ["1.9.2","2026-11-08","When there is no motion data the app now says why (page security, running inside another app, permission state, empty events) and lists fixes. Added a Retry sensors button on the simulator banner and the Sensor test, and a fallback to the absolute-orientation event."],
 ["1.9.1","2026-11-08","If the reading gets worse twice in a row while you follow Roll or Pitch, the app now says so and offers one tap to swap clockwise/counterclockwise or to run the sensor sign check. The leg test's 'opposite way' result also offers the swap. Locked-leg steps remind you to do every leg listed."],
 ["1.9.0","2026-11-08","Legs that can't be adjusted: mark any leg as locked (stripped or seized leveler) and Roll/Pitch move only the other legs, keeping all four feet in plane so the cabinet doesn't rock. Setup says which axes are still adjustable. A Test button checks whether a leg actually responds. New Adjust setting: both, pitch only, or roll only."],
 ["1.8.0","2026-11-07","Audio cues: rising tone when your adjustment is improving the reading, falling buzz when it is getting worse, a soft tick each second while sensor data is live, and an alarm if it stops. Corrections for backwards directions: reverse pitch sensor, reverse roll sensor, swap clockwise/counterclockwise; the Sensor test can apply the measured signs."],
 ["1.7.2","2026-11-07","Leveling steps name the exact leg's leveler bolt to turn (not the jam nut), with left/right defined from the front of the machine."],
 ["1.7.1","2026-11-07","Leveling steps now say which way to turn the leveler bolt (clockwise raises a corner, counterclockwise lowers it, viewed from above), and Setup explains the jam nut."],
 ["1.7.0","2026-11-06","Sensor test (from Setup): update rate and noise at rest with a suggested settle strictness, beta/gamma sign check, accuracy against a known wedge, and copyable results."],
 ["1.6.0","2026-11-06","Reference spot: pick top, middle or bottom per machine. Roll, Pitch and Verify use it, spot check shows the other spots as offsets from it, and the spread is compared with your last check."],
 ["1.5.0","2026-11-06","Version number in header and footer, What's new list, Check for updates, and an Updated card after an upgrade."],
 ["1.4.0","2026-11-06","Guided spot check: auto-captures when the phone is still, signals with a tone and vibration, then waits for you to move to the next spot (top, middle, bottom). Settle strictness option and per-spot Redo."]
];
/* ---------- storage ---------- */
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

/* ---------- profiles ----------
 pitch: target playfield pitch (deg, back higher than front)
 spanFB/spanLR: distance between leg centers (in) front-to-back / left-to-right
 tpi: leveler threads per inch (3/8-16 = 16, 1/2-13 = 13)
 NOTE: preset numbers are typical starting values. Confirm against the machine's manual. */
const GEN={refKey:"mid",refSpot:"Mid-playfield (app default)",tolP:0.2,tolR:0.1,tpi:16,manualUrl:"",src:"Generic default (unverified)",tips:{}};
const PRESETS=[
 {...GEN,name:"Generic standard body",pitch:6.5,spanFB:38,spanLR:20,notes:"Typical value. Confirm in your manual."},
 {...GEN,name:"Generic widebody",pitch:6.5,spanFB:38,spanLR:26,notes:"Typical value. Confirm in your manual."},
 {...GEN,name:"Williams/Bally WPC era",pitch:6.5,spanFB:38,spanLR:20,notes:"Typical value. Confirm in your manual."},
 {...GEN,name:"Stern (SAM/Spike)",pitch:6.5,spanFB:38,spanLR:20,notes:"Typical value. Confirm in your manual."},
 {...GEN,name:"Jersey Jack",pitch:6.5,spanFB:38,spanLR:26,notes:"Typical value. Confirm in your manual."},
 {...GEN,key:"t3",refKey:"flip",name:"Terminator 3: Rise of the Machines (Stern 2003)",pitch:6.5,spanFB:38,spanLR:20,
  manualUrl:"https://sternpinball.com/wp-content/uploads/2018/11/Terminator3_Manual.pdf",
  src:"Stern manual (documented)",refSpot:"The manual puts the bubble level on the lower-right wood rail. The app default is mid-playfield, so also check there.",notes:"6.5° per the Stern manual. Spans are estimates; measure yours.",
  tips:{
   setup:["Manual: the cabinet is designed for 6.5° when all four levelers are turned fully in (1.25 in from floor to bottom of leg). Start there.",
          "The manual's bubble level sits on the lower-right wood rail. This app replaces it: use the phone on the playfield.",
          "Extending the rear levelers for more pitch is possible, but the manual says it is not recommended."],
   roll:["Adjust the front levelers. The manual also suggests rolling a ball down the center of the playfield to sanity-check side-to-side."],
   pitch:["With all four levelers fully in you should already be near 6.5°. A big miss usually means an uneven floor or a leg problem, so check that before extending the rear levelers far."],
   verify:["Tighten the jam nuts, then recheck pitch and roll once more."]}},
 {...GEN,key:"sttng",name:"Star Trek: The Next Generation (Williams 1993, widebody)",pitch:6.5,spanFB:38,spanLR:26,
  manualUrl:"https://planetarypinball.com/reference/gamemanuals/Star_Trek_The_Next_Generation/files/assets/basic-html/page12.html",
  src:"Partly confirmed (manual excerpt says plumb bob is factory-set for 6°)",notes:"Williams-era manuals recommend 6 to 6.5°. Confirm on manual pages 12-14.",
  tips:{
   setup:["Widebody: side-to-side leg spacing is set to 26 in. Measure yours.",
          "A manual excerpt says the plumb bob tilt is factory-set for a 6° angle, which suggests a 6° design pitch. This profile uses 6.5° (Williams-era range is 6 to 6.5°). Edit the target if the manual's leveling page says otherwise.",
          "The game uses six balls."],
   pitch:["Williams bubble levels: the first line is about 6° and each line after that is about +0.5°."],
   verify:["Re-set the plumb bob tilt after final pitch: loosen the screw at the bottom of the unit, move the pointer one groove at a time, then tighten."]}},
 {...GEN,key:"xenon",name:"Xenon (Bally 1980)",pitch:6.5,spanFB:38,spanLR:20,
  manualUrl:"https://archive.org/download/1979xenonmanual/1979Xenon_Manual_text.pdf",
  src:"No pitch figure in the manual (6.5° is a general default)",notes:"The Bally manual gives no pitch angle. 6.5° is a solid-state default; 6 to 7° is a normal range.",
  tips:{
   setup:["The manual does not give a pitch angle. 6.5° is a general default; adjust by play (6 to 7°).",
          "Three tilt switches: panel tilt, plumb bob (left side near the coin door), and ball tilt above it.",
          "Ball count is 3 or 5 via MPU switches 31/32."],
   verify:["Per the manual, adjust the plumb bob tilt AFTER the game is on location and the levelers are set.",
           "Ball tilt is set so the ball rolls free to the switch blade if the front of the cabinet is raised."]}},
 {...GEN,key:"twinky",name:"Twinky (Chicago Coin 1967, EM)",pitch:5,tolP:0.3,tolR:0.15,spanFB:36,spanLR:20,
  src:"Unverified (no manual or spec found)",notes:"No pitch spec found. About 5° is a common starting point for older EM games.",
  tips:{
   setup:["No manual or pitch spec was found. About 5° is a common starting point for older EM machines, so tune it by play in 0.5° steps.",
          "Leg spacing and leveler thread are estimates. Measure your own and edit the profile.",
          "If you find the manual or flyer with a leveling note, paste it into the manual box in the editor to update the target."],
   verify:["Play a few balls. If it plays too slow or too fast, change the target by 0.5° and rerun."]}}
];
// add any new built-in machine profiles to existing saved lists
const hadSaved=!!LS("pl.profiles");
let P=LS("pl.profiles")||PRESETS.map((p,i)=>({id:p.key?"k_"+p.key:"p"+i,...p}));
PRESETS.forEach(p=>{ if(p.key && !P.some(x=>x.key===p.key)) P.push({id:"k_"+p.key,...p}); });
let cur=LS("pl.cur")||P[0].id;
let off=LS("pl.off")||{p:0,r:0};
let opts=Object.assign({flip:false,beep:true,speak:false,strict:"normal",trend:true,tick:true,revP:false,revR:false,revTurn:false},LS("pl.opts")||{});
// revP/revR: reverse a sensor axis. revTurn: swap clockwise/counterclockwise in the instructions (e.g. left-hand threads).
const sg=k=>opts[k]?-1:1;
const T=()=>opts.revTurn?{cw:"counterclockwise",ccw:"clockwise"}:{cw:"clockwise",ccw:"counterclockwise"};
let hist=LS("pl.hist")||{};
const tipsHtml=(ph,title)=>{const t=(prof().tips||{})[ph];return t&&t.length?`<div class="card" style="border-color:var(--acc)"><h2>${title||"Machine notes"}</h2><ul class="mut">${t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""};
const prof=()=>P.find(x=>x.id===cur)||P[0];
// reference spot key (top|mid|flip). Older saved profiles have none: fall back to the built-in's, else mid.
const refKey=p=>p.refKey||(PRESETS.find(x=>x.key&&x.key===p.key)||{}).refKey||"mid";
const refName=p=>(SPOTS.find(s=>s[0]===refKey(p))||SPOTS[1])[1];
const persist=()=>{save("pl.profiles",P);save("pl.cur",cur);save("pl.off",off);save("pl.opts",opts);save("pl.hist",hist)};

/* ---------- sensors ---------- */
const D=Math.PI/180;
let raw={p:0,r:0,has:false}, sm={p:0,r:0,init:false}, sim=null, rawLast={p:0,r:0,a:null}, evT=[], lastEv=0;
let evAll=0, evNull=0, permRes="not requested", permQ={}, absOn=false; // diagnostics: why is there no motion data?
function onOri(e){
  evAll++;
  if(e.beta==null||e.gamma==null){evNull++;return} // browsers send empty values when motion sensors are blocked or missing
  const wasSim=sim&&sim.auto; raw.has=true;
  rawLast.p=e.beta; rawLast.r=e.gamma; rawLast.a=e.alpha; // unsmoothed, used by settle / spot-check logic
  const nt=performance.now(); lastEv=nt; evT.push(nt); while(evT.length&&nt-evT[0]>2000)evT.shift();
  if(wasSim){sim=null;sm.init=false;setTimeout(render,0)}
  // beta: top edge raised => positive (back higher when phone top points to back). gamma: right edge down => positive.
  if(!sm.init){sm.p=e.beta;sm.r=e.gamma;sm.init=true}
  else{sm.p+=(e.beta-sm.p)*0.18;sm.r+=(e.gamma-sm.r)*0.18}
}
let sensing=false;
async function startSensors(){
  if(sensing)return;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission(); permRes=String(r);
      if(r==="denied"){sim=sim||{auto:true,p:prof().pitch+0.8,r:0.4};render();return;}
    }
  }catch(e){permRes="error: "+((e&&e.name)||e)}
  window.addEventListener("deviceorientation",onOri,true);
  sensing=true;
  queryPerms();
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
  setTimeout(()=>{ if(!raw.has){
    // nothing usable yet: also listen to the absolute-orientation event (same beta/gamma on Chrome for Android), then fall back to the simulator
    if(!absOn){absOn=true;window.addEventListener("deviceorientationabsolute",onOri,true)}
    sim=sim||{auto:true,p:prof().pitch+0.8,r:0.4}; render(); } },1800);
}
async function queryPerms(){
  for(const n of ["accelerometer","gyroscope","magnetometer"]){
    try{const r=await navigator.permissions.query({name:n}); permQ[n]=r.state}catch(e){permQ[n]="n/a"}
  }
}
// Race fix: on some loads Chrome never starts delivering events to the listener that was added during page load
// (a reload fixes it). While there is no data, drop and re-add the listeners again and again, and on every focus / visible / tap.
let rearmN=0;
function rearm(){
  if(raw.has||!sensing)return;
  rearmN++;
  try{window.removeEventListener("deviceorientation",onOri,true);window.removeEventListener("deviceorientationabsolute",onOri,true)}catch(e){}
  window.addEventListener("deviceorientation",onOri,true);
  if(absOn)window.addEventListener("deviceorientationabsolute",onOri,true);
}
setInterval(()=>{ if(!raw.has&&sensing&&(rearmN<12||Date.now()%5<1))rearm() },1000);
["visibilitychange","pageshow","focus"].forEach(n=>window.addEventListener(n,()=>{ if(document.visibilityState!=="hidden")rearm() }));
window.addEventListener("pointerdown",()=>rearm(),true);
// Retry from scratch (needs a tap, so the browser will show its permission prompt if it has one)
async function retrySensors(){
  try{window.removeEventListener("deviceorientation",onOri,true);window.removeEventListener("deviceorientationabsolute",onOri,true)}catch(e){}
  sensing=false; absOn=false; evAll=0; evNull=0; if(sim&&sim.auto)sim=null; render();
  await startSensors(); render();
}
const diagEv=()=>`${evAll}${evNull?` (<b class='far'>${evNull} with empty values</b>: the browser is blocking motion sensors)`:""}`;
function diagHtml(){
  const row=(k,v)=>`<tr><td class="mut" style="padding:2px 8px 2px 0;vertical-align:top">${k}</td><td>${v}</td></tr>`;
  const perm=Object.entries(permQ).map(([k,v])=>k+": "+v).join(", ")||"checking…";
  const inFrame=(()=>{try{return window.top!==window}catch(e){return true}})();
  return `<details open style="margin-top:8px"><summary class="mut">Why no motion data? Details and fixes</summary>
  <table style="font-size:13px;margin:6px 0">
  ${row("Page",esc(location.protocol+"//"+(location.host||"(local file)"))+(window.isSecureContext?"":" <b class='far'>not secure: sensors need https</b>"))}
  ${row("Inside another app or frame",inFrame?"<b class='far'>yes: sensors are usually blocked there</b>":"no")}
  ${row("Motion API",typeof DeviceOrientationEvent!=="undefined"?"present":"<b class='far'>missing</b>")}
  ${row("Permission prompt",typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"?"supported, answer: "+esc(permRes):"not needed")}
  ${row("Browser sensor permissions",esc(perm))}
  ${row("Events received",`<span id="diagEv">${diagEv()}</span>`)}
  </table>
  <p class="mut" style="font-size:13px;margin:4px 0">Things to try, in order:</p>
  <ol class="mut" style="font-size:13px"><li>Open this page in <b>Chrome itself</b>, not inside another app (Gmail, Drive, Messages, GitHub, a link preview). In that app's menu choose "Open in Chrome".</li>
  <li>In Chrome: ⋮ → Settings → Site settings → <b>Motion sensors</b> → allow, and make sure this site isn't in the blocked list. Or tap the icon left of the address bar → Permissions.</li>
  <li>Pixel: if Developer options has the <b>Sensors Off</b> quick tile switched on, turn it off.</li>
  <li>Tap <b>Retry sensors</b>, then reload the page once.</li></ol></details>`;
}
const dir=()=>opts.flip?-1:1;
function live(){
  if(sim) return {p:sim.p*dir(),r:sim.r*dir()};
  return {p:(sm.p-off.p)*dir()*sg("revP"),r:(sm.r-off.r)*dir()*sg("revR")};
}
// calibrated but NOT smoothed
function liveRaw(){
  if(sim) return {p:sim.p*dir(),r:sim.r*dir()};
  return {p:(rawLast.p-off.p)*dir()*sg("revP"),r:(rawLast.r-off.r)*dir()*sg("revR")};
}

/* ---------- audio ---------- */
let AC=null;
function chime(n=1){
  if(opts.speak&&window.speechSynthesis){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(n>1?"Level":"On target"))}catch(e){}}
  if(!opts.beep)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.18;
      o.frequency.value=880;g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.16);
    }
  }catch(e){}
}

function speak(t){
  if(opts.speak&&t&&window.speechSynthesis){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
}
// tone(seq, say): play a sequence of notes (Hz), vibrate, and optionally speak.
function tone(seq,say){
  try{ if(navigator.vibrate) navigator.vibrate([60,40,60]); }catch(e){}
  speak(say);
  if(!opts.beep)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    seq.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.16;
      o.frequency.value=f;g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.15);
    });
  }catch(e){}
}

/* ---------- math helpers ---------- */
const FR={0:"",1:"⅛",2:"¼",3:"⅜",4:"½",5:"⅝",6:"¾",7:"⅞"};
function turns(deg,span,tpi){
  const inches=span*Math.tan(Math.abs(deg)*D);
  const t=inches*tpi, e=Math.max(1,Math.round(t*8)); // eighths, min 1/8
  const w=Math.floor(e/8), f=e%8;
  return {txt:(w?w:"")+FR[f]||"⅛", t, inches};
}
const f2=x=>(x>=0?"+":"")+x.toFixed(2);
const cls=(err,tol)=>{const a=Math.abs(err);return a<=tol?"good":a<=tol*3?"near":"far"};

/* ---------- state ---------- */
let progKey="", progStart=0;
let step=0, okSince=0, chimed=false, hold=0, saved=false, calA=null, calB=null, capturing=false;
const STEPS=["Setup","Calibrate","Roll","Pitch","Verify","Spots"];
// guided order: top, middle, bottom
const SPOTS=[["top","Near the top"],["mid","Mid-playfield"],["flip","Near the flippers"]];
const SAY=["the top","the middle","the bottom"];
let spots={};
let showLog=false, updMsg="", showUpd=false, updFrom="";

/* ---------- views ---------- */
function render(){
  const p=prof();
  let h=`<header><h1>🎯 Pin Leveler <small class="mut">v${VERSION}</small></h1><div class="dots">${STEPS.map((s,i)=>`<i class="${i===step?"on":i<step?"done":""}" title="${s}"></i>`).join("")}</div></header>`;
  if(step>=1)h+=`<div class="mut" id="dbg" style="margin:-4px 0 8px;font-size:12px"></div>`;
  if(sim&&!tst)h+=`<div class="card sim"><b class="near">⚠ SIMULATED readings: no motion data from this phone.</b> <span class="mut">These sliders are fake.</span>
   <div class="row fit" style="margin-top:6px"><button class="pri retrySens">Retry sensors</button></div>${diagHtml()}
   <label>Pitch <span id="sp">${sim.p.toFixed(2)}</span>°<input id="simP" type="range" min="3" max="10" step="0.05" value="${sim.p}"></label>
   <label>Roll <span id="sr">${sim.r.toFixed(2)}</span>°<input id="simR" type="range" min="-3" max="3" step="0.05" value="${sim.r}"></label></div>`;
  if(tst) h+=viewTest();
  else if(legT) h+=viewLegTest();
  else{
    if(step===0) h+=updatedCard()+viewSetup(p);
    if(step===1) h+=viewCal();

}

function footerHtml(){

const cmpVer=(a,b)=>{const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);
  for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
function refreshUpd(){const e=$("#updMsg"); if(e){e.innerHTML=updMsg;bindUpd()}}
function bindUpd(){const r=$("#reloadNow"); if(r)r.onclick=()=>location.replace(location.pathname+"?r="+Date.now())}
async function checkUpdate(){
  updMsg="Checking…"; refreshUpd();
  try{
    if(!/^https?:$/.test(location.protocol))throw new Error("open the page over http(s)");
    const r=await fetch(location.origin+location.pathname+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const m=/const VERSION\s*=\s*"([^"]+)"/.exec(await r.text());
    if(!m)throw new Error("version not found");
    const c=cmpVer(m[1],VERSION);
    updMsg=c>0?`Version ${esc(m[1])} is available. <button class="pri" id="reloadNow">Reload now</button>`
      :c===0?`✅ You're on the latest version (v${VERSION}).`
      :`This copy (v${VERSION}) is newer than the published version (v${esc(m[1])}).`;
  }catch(e){updMsg=`Couldn't check for updates (${esc(e.message)}).`}
  refreshUpd();
}

function findAngles(text){
  const out=[],re=/(\d{1,2}(?:\.\d+)?)\s*(?:°|degrees?|deg\b)/gi;let m;
  while((m=re.exec(text))){
    const v=parseFloat(m[1]); if(v<1||v>15)continue;
    const ctx=text.slice(Math.max(0,m.index-50),m.index+m[0].length+30).replace(/\s+/g," ");
    out.push({v,ctx,score:/pitch|incline|slope|angle|tilt|level/i.test(ctx)?1:0});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,6);
}

/* ---------- live update ---------- */
function guideText(l,p){
  const eP=l.p-p.pitch, eR=l.r;
  if(step===2){
    if(Math.abs(eR)<=p.tolR)return {ok:true,t:`✅ Roll is level (${f2(eR)}°). Tap Next.`};
    if(lockedOf(p).length)return lockedGuide(l,p);
    const g=turns(eR,p.spanLR,p.tpi), side=eR>0?"RIGHT":"LEFT", other=eR>0?"LEFT":"RIGHT";
    return {ok:false,t:`${side} side is low by ${Math.abs(eR).toFixed(2)}°.<br>Turn the <b>${side} FRONT leg's leveler bolt ${T().cw} ≈ ${g.txt} turn${g.t>1.1?"s":""}</b> <span class="mut" style="font-weight:400">(looking down at the wrench; this raises that corner)</span><br><span class="mut" style="font-weight:400">or turn the ${other} FRONT leg's leveler bolt ${T().ccw} by the same (lowers that corner). Left/right as you stand at the front of the machine. Turn the bolt, not the jam nut.</span>`};
  }
  if(step===3){
    if(Math.abs(eP)<=p.tolP)return {ok:true,t:`✅ Pitch is on target (${l.p.toFixed(2)}°). Tap Next.`};
    if(lockedOf(p).length)return lockedGuide(l,p);
    const g=turns(eP,p.spanFB,p.tpi);
    if(eP<0)return {ok:false,t:`Needs ${Math.abs(eP).toFixed(2)}° more pitch.<br>Turn the <b>leveler bolts on BOTH REAR legs (left rear and right rear) ${T().cw} ≈ ${g.txt} turn${g.t>1.1?"s":""} each</b> <span class="mut" style="font-weight:400">(looking down at the wrench; this raises the rear)</span><br><span class="mut" style="font-weight:400">or turn the leveler bolts on BOTH FRONT legs ${T().ccw} by the same (lowers the front). Turn the bolts, not the jam nuts.</span>`};
    return {ok:false,t:`${eP.toFixed(2)}° too steep.<br>Turn the <b>leveler bolts on BOTH REAR legs (left rear and right rear) ${T().ccw} ≈ ${g.txt} turn${g.t>1.1?"s":""} each</b> <span class="mut" style="font-weight:400">(looking down at the wrench; this lowers the rear)</span><br><span class="mut" style="font-weight:400">or turn the leveler bolts on BOTH FRONT legs ${T().cw} by the same (raises the front). Turn the bolts, not the jam nuts.</span>`};
  }
  const okP=!useP(p)||Math.abs(eP)<=p.tolP, okR=!useR(p)||Math.abs(eR)<=p.tolR; // an axis you're not adjusting doesn't count
  if(okP&&okR)return {ok:true,t:`✅ In tolerance. Hold still…`};
  const bits=[];
  if(!okR)bits.push(`Roll off by ${f2(eR)}° (${eR>0?"right":"left"} low): go back to the Roll step.`);
  if(!okP)bits.push(`Pitch off by ${f2(eP)}°: go back to the Pitch step.`);
  return {ok:false,t:bits.join("<br>")};
}

function update(){
  const p=prof(), l=live();
  const de=$("#diagEv"); if(de)de.innerHTML=diagEv();
  if(tst){const e=$("#tLive"); if(e)e.innerHTML=raw.has?`beta <b>${rawLast.p.toFixed(2)}°</b> · gamma <b>${rawLast.r.toFixed(2)}°</b> · alpha ${rawLast.a==null?"–":rawLast.a.toFixed(0)+"°"} · <b>${evRate().toFixed(0)} Hz</b>`:"<b class='near'>NO DATA</b>"; return;}
  const d=$("#dbg"); if(d) d.textContent= sim?"Sensor: NO DATA (simulating)":(raw.has?`Sensor: live · raw pitch ${sm.p.toFixed(2)}° roll ${sm.r.toFixed(2)}° · offset ${off.p.toFixed(2)}°/${off.r.toFixed(2)}°`:"Sensor: waiting for data…");
  if(step===1){
    const c=$("#calStat"); if(c&&!capturing&&!calA)c.textContent=`Live: ${sm.p.toFixed(2)}°, ${sm.r.toFixed(2)}°`;
    return;
  }
  if(step===5){const a=$("#pv"),b=$("#rv"); if(a){a.textContent=l.p.toFixed(2)+"°";a.className=cls(l.p-p.pitch,p.tolP);b.textContent=f2(l.r)+"°";b.className=cls(l.r,p.tolR)}
    if(flow.on){const fm=$("#flowMsg"); if(fm){fm.innerHTML=flowText();
      $("#flowBar").style.width=(flow.st==="settle"?Math.min(1,flowQuiet/QUIET_MS)*100:0)+"%";
      $("#flowNow").disabled=flow.st!=="settle"; $("#flowMoved").disabled=flow.st!=="waitmove"}}
    return;}
  if(step<2)return;
  const pv=$("#pv"),rv=$("#rv"); if(!pv)return;
  const eP=l.p-p.pitch;
  pv.textContent=l.p.toFixed(2)+"°"; pv.className=cls(eP,p.tolP);
  rv.textContent=f2(l.r)+"°"; rv.className=cls(l.r,p.tolR);
  const dot=$("#dot"), sc=45; // px per degree
  const dx=Math.max(-90,Math.min(90,l.r*sc)), dy=Math.max(-90,Math.min(90,eP*sc));
  dot.style.transform=`translate(${dx}px,${dy}px)`;
  const gP=!useP(p)||Math.abs(eP)<=p.tolP, gR=!useR(p)||Math.abs(l.r)<=p.tolR, fP=useP(p)&&Math.abs(eP)>p.tolP*3, fR=useR(p)&&Math.abs(l.r)>p.tolR*3;
  dot.className="d "+(gP&&gR?"good":(fP||fR)?"far":"");
  const g=guideText(l,p); $("#guide").innerHTML=g.t;
  if(step===2||step===3){ // progress since this step began (or since the axes mode changed)
    const err=Math.abs(step===2?l.r:eP), tol=step===2?p.tolR:p.tolP, key=step+"|"+cur+"|"+axesOf(p);
    if(progKey!==key){progKey=key;progStart=Math.max(err,tol*2)}
    if(err>progStart)progStart=err; // got worse than where we began: widen the scale
    const pct=err<=tol?100:Math.max(0,Math.min(99,Math.round((1-(err-tol)/(progStart-tol))*100)));
    const pt=$("#progTxt"), pb=$("#progBar");
    if(pt)pt.innerHTML=`Progress: <b>${pct}%</b> · started ${progStart.toFixed(2)}° off, now ${err.toFixed(2)}° off (target within ±${tol}°)`;
    if(pb)pb.style.width=pct+"%";
  }
  const now=performance.now();
  if(g.ok){ if(!okSince){okSince=now} const held=now-okSince;
    if(held>600&&!chimed){chimed=true;chime(step===4?2:1)}
    if(step===4){ hold=Math.min(1,held/3000); $("#holdBar").style.width=(hold*100)+"%";
      if(hold>=1&&!saved){saved=true;chime(3);
        (hist[p.id]=hist[p.id]||[]).unshift({t:Date.now(),p:+l.p.toFixed(2),r:+l.r.toFixed(2)}); hist[p.id]=hist[p.id].slice(0,8); persist();
        $("#result").innerHTML=resultHtml(p);$("#next").textContent="Next: spot check →";} }
  } else { okSince=0; chimed=false; if(step===4&&!saved){hold=0;$("#holdBar").style.width="0"} }
}

/* ---------- events ---------- */
function sample(ms){return new Promise(res=>{const a=[];const iv=setInterval(()=>a.push({p:sim?sim.p:sm.p,r:sim?sim.r:sm.r}),50);
  setTimeout(()=>{clearInterval(iv);const n=a.length||1;res({p:a.reduce((s,x)=>s+x.p,0)/n,r:a.reduce((s,x)=>s+x.r,0)/n})},ms)})}

/* ---------- guided spot check ---------- */
const THR={strict:0.05,normal:0.08,relaxed:0.15}; // max range (deg) of pitch and roll while "still"
const QUIET_MS=1500, MIN_N=15, MOVE_DEG=0.5;
let flow={on:false,i:0,st:"settle",t0:0,only:false}, buf=[], flowQuiet=0;

// Walk back from the newest sample while pitch and roll range stay within thr.
function quietWindow(thr){
  let n=0,sp=0,sr=0,oldest=0,a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  for(let k=buf.length-1;k>=0;k--){const s=buf[k]; if(s.t<flow.t0)break;
    const a2=Math.min(a,s.p),b2=Math.max(b,s.p),c2=Math.min(c,s.r),d2=Math.max(d,s.r);
    if(b2-a2>thr||d2-c2>thr)break;
    a=a2;b=b2;c=c2;d=d2;n++;sp+=s.p;sr+=s.r;oldest=s.t}
  return {n,ms:n?buf[buf.length-1].t-oldest:0,p:n?sp/n:0,r:n?sr/n:0};
}
function recentMean(ms){
  const now=performance.now(), a=buf.filter(s=>s.t>=Math.max(flow.t0,now-ms));
  if(!a.length)return liveRaw();
  return {p:a.reduce((s,x)=>s+x.p,0)/a.length,r:a.reduce((s,x)=>s+x.r,0)/a.length};
}
function flowTick(){
  if(!flow.on||(!raw.has&&!sim))return;
  const now=performance.now();
  const l=liveRaw(); buf.push({t:now,p:l.p,r:l.r});
  while(buf.length&&now-buf[0].t>20000)buf.shift();
  if(flow.st==="settle"){

function getAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}

  o=o||{}; const type=o.type||"sine",gain=o.gain||0.15,dur=o.dur||0.09,gap=o.gap||0.1;
  if(!opts.beep)return; const a=getAC(); if(!a||a.state!=="running")return;
  try{freqs.forEach((f,i)=>{const osc=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*gap;

// Improving / worsening: compare the error now with the error TREND_MS ago, on the Roll and Pitch steps.
// Rising two-note = closer to target, falling buzz = further away. Silent while holding on target or standing still.
const TREND_MS=1200, TREND_DEG=0.03;
let trendHist=[];
function trendTick(){
  if(!opts.trend||tst||(step!==2&&step!==3)||(!raw.has&&!sim)){trendHist=[];return}
  const p=prof(), l=live(), now=performance.now();
  const m=step===2?Math.abs(l.r):Math.abs(l.p-p.pitch), tol=step===2?p.tolR:p.tolP;
  trendHist.push({t:now,m});
  while(trendHist.length&&now-trendHist[0].t>TREND_MS+300)trendHist.shift();
  const old=trendHist[0]; if(!old||now-old.t<TREND_MS)return;
  const d=old.m-m;
  const rec=trendHist.find(x=>now-x.t<=450);
  if(rec&&Math.abs(rec.m-m)<0.008)return; // not moving right now: no late cue after you stop turning
  if(m<=tol&&old.m<=tol)return; // staying on target: the on-target chime covers it
  if(d>TREND_DEG){blip([520,780],{gain:0.16});trendHist=[];worseN=0}
  else if(d<-TREND_DEG){blip([300,200],{type:"sawtooth",gain:0.1,dur:0.14,gap:0.12});trendHist=[];
    if(++worseN>=2&&!worseHint){worseHint=true;render()}} // twice in a row: probably reversed directions, say so
}
let worseN=0, worseHint=false;

}

function spotSummary(p){

  if(got.length<2)return `<p class="mut">Capture at least two spots to compare them.</p>`;
  const ps=got.map(([k,n])=>({n,v:spots[k].p})), rs=got.map(([k,n])=>({n,v:spots[k].r}));
  const hi=a=>a.reduce((m,x)=>x.v>m.v?x:m), lo=a=>a.reduce((m,x)=>x.v<m.v?x:m);

  out.push(sp<=p.tolP?`<p class="good">✅ Pitch is consistent across spots (range ${sp.toFixed(2)}°).</p>`
    :`<p class="near">⚠ Pitch varies by ${sp.toFixed(2)}° (highest ${hi(ps).n.toLowerCase()}, lowest ${lo(ps).n.toLowerCase()}). That points to the playfield or cabinet (curve, warp, mounting), not the legs. Keep the legs set from the mid-playfield reading and judge by play.</p>`);

  const rk=refKey(p), m=spots[rk];
  if(sp>1||sr>1)out.push(`<p class="far">A spread over 1° usually means the phone was resting on an insert or plastic. Redo the outlying spot on bare wood before trusting these numbers.</p>`);
  if(m&&(Math.abs(m.p-p.pitch)>p.tolP||Math.abs(m.r)>p.tolR))
    out.push(`<p class="far">The reference spot (${refName(p).toLowerCase()}) reads off target (pitch ${m.p.toFixed(2)}°, roll ${f2(m.r)}°). Go back to Roll and Pitch and adjust.</p>`);
  // compare the spread (offsets from the reference spot) with the previous spot check for this machine
  const prev=(hist[p.id]||[]).slice(1).find(x=>x.spots&&x.spots[rk]);
  if(m&&prev){
    const d=SPOTS.filter(([k])=>k!==rk&&spots[k]&&prev.spots[k]).map(([k,n])=>({n,d:(spots[k].p-m.p)-(prev.spots[k].p-prev.spots[rk].p)}));

/* ---------- legs & axes ---------- */
// A leg that can't be adjusted (stripped, seized) is "locked". The plan moves only the other legs and keeps the four feet
// in one plane (no twist), so the cabinet doesn't start to rock. Left/right are as you stand at the front.
// Model: each leg's height change d = u*[1,1,1,1] + (hP/2)*BP + (hR/2)*BR, where hP = rear avg - front avg and
// hR = left avg - right avg are the height changes wanted, and u is a free uniform shift chosen so locked legs get 0.
const LEGS=["FL","FR","RL","RR"];
const LEGN={FL:"LEFT FRONT",FR:"RIGHT FRONT",RL:"LEFT REAR",RR:"RIGHT REAR"};
const BP={FL:-1,FR:-1,RL:1,RR:1}, BR={FL:1,FR:-1,RL:1,RR:-1}; // pitch pattern (rear up) and roll pattern (left up = right low)
const lockedOf=p=>LEGS.filter(k=>(p.locked||[]).includes(k));
const axesOf=p=>p.axes==="pitch"||p.axes==="roll"?p.axes:"both";
const useP=p=>axesOf(p)!=="roll", useR=p=>axesOf(p)!=="pitch";
const skipStep=(n,p)=>(n===2&&!useR(p))||(n===3&&!useP(p)); // pitch-only skips Roll, roll-only skips Pitch
const stepAfter=s=>{let n=s+1;while(n<5&&skipStep(n,prof()))n++;return n};
const stepBefore=s=>{let n=s-1;while(n>1&&skipStep(n,prof()))n--;return n};
function turnsIn(inches,tpi){const t=inches*tpi, e=Math.max(1,Math.round(t*8)), w=Math.floor(e/8), f=e%8; return {txt:(w?w:"")+FR[f]||"⅛", t}}

// planLegs: leg height changes (inches, + = extend/raise) for wanted hP, hR. If the locked legs make that impossible,
// (aP,aR) is the closest achievable combination (projection onto what the locked legs allow).
function planLegs(p,hP,hR){
  const L=lockedOf(p); let aP=hP, aR=hR;
  if(L.length>=2){
    const i0=L[0], rows=L.slice(1).map(i=>[BP[i]-BP[i0],BR[i]-BR[i0]]).filter(v=>v[0]||v[1]);
    if(rows.length){
      const n=rows[0], parallel=rows.every(v=>v[0]*n[1]-v[1]*n[0]===0);
      if(!parallel){aP=0;aR=0}
      else{const k=(aP*n[0]+aR*n[1])/(n[0]*n[0]+n[1]*n[1]); aP-=k*n[0]; aR-=k*n[1]}
    }
  }
  const u=L.length?-(aP/2)*BP[L[0]]-(aR/2)*BR[L[0]]:0, d={};
  LEGS.forEach(k=>{d[k]=u+aP/2*BP[k]+aR/2*BR[k]});
  return {d,aP,aR};
}
function legSummary(p){
  const L=lockedOf(p); if(!L.length)return "All four legs are adjustable: roll uses the front legs and pitch uses the rear legs.";
  const names=L.map(k=>LEGN[k].toLowerCase()).join(" and ")+(L.length>1?" legs are":" leg is");
  const a=planLegs(p,1,0), b=planLegs(p,0,1), near=(x,y)=>Math.abs(x-y)<1e-6;
  const pOK=near(a.aP,1)&&near(a.aR,0), rOK=near(b.aR,1)&&near(b.aP,0);
  if(pOK&&rOK)return `With the ${names} locked, roll and pitch can both still be adjusted by moving the other legs.`;
  if(pOK)return `With the ${names} locked, only PITCH can be adjusted. Roll cannot be changed independently.`;
  if(rOK)return `With the ${names} locked, only ROLL can be adjusted. Pitch cannot be changed independently.`;
  const mix=[[1,1],[1,-1]].some(([x,y])=>{const r=planLegs(p,x,y);return Math.abs(r.aP)+Math.abs(r.aR)>1e-9});
  return mix?`With the ${names} locked, roll and pitch can't be adjusted independently, only a linked mix of the two. Free a leg if you can.`
            :`With the ${names} locked, nothing can be adjusted. Free a leg (or replace its leveler) first.`;
}
function legsCard(p){
  const L=lockedOf(p), ax=axesOf(p);
  const tile=k=>`<div class="leg ${L.includes(k)?"lk":""}"><b>${L.includes(k)?"🔒 ":""}${LEGN[k]}</b><br><button data-leg="${k}">${L.includes(k)?"Unlock":"Can't adjust"}</button><button data-legtest="${k}">Test</button></div>`;
  return `<div class="card"><h2>Legs & what to adjust</h2>
  <p class="mut">Mark any leg whose leveler bolt can't be turned (stripped, seized, or bottomed out). The steps then move only the other legs around it. Not sure whether a leg works? Tap <b>Test</b>.</p>
  <p class="mut" style="text-align:center;margin:4px 0">▲ back of machine (backbox)</p>
  <div class="grid2">${tile("RL")}${tile("RR")}${tile("FL")}${tile("FR")}</div>
  <p class="mut" style="text-align:center;margin:4px 0">▼ front (where you stand)</p>
  <p class="${L.length?"near":"mut"}" id="legSum">${legSummary(p)}</p>
  ${L.length?`<p class="mut" style="font-size:12px">A stripped leveler is a cheap part to replace (3/8"-16 for most machines). This is a workaround until then.</p>`:""}
  <label>Adjust<select id="axSel"><option value="both" ${ax==="both"?"selected":""}>Roll and pitch</option><option value="pitch" ${ax==="pitch"?"selected":""}>Pitch only</option><option value="roll" ${ax==="roll"?"selected":""}>Roll only</option></select></label></div>`;
}
// Roll / Pitch guidance when at least one leg is locked
function lockedGuide(l,p){
  const roll=step===2, eP=l.p-p.pitch, eR=l.r, L=lockedOf(p);
  const need=roll?-p.spanLR*Math.tan(eR*D):-p.spanFB*Math.tan(eP*D);
  const pl=roll?planLegs(p,0,need):planLegs(p,need,0);
  const got=roll?pl.aR:pl.aP, other=roll?pl.aP:pl.aR, oSpan=roll?p.spanFB:p.spanLR, axis=roll?"roll":"pitch";
  const lockTxt=`${L.map(k=>LEGN[k]).join(" and ")} leg${L.length>1?"s are":" is"} locked (leave ${L.length>1?"them":"it"} alone).`;
  const head=roll?`${eR>0?"RIGHT":"LEFT"} side is low by ${Math.abs(eR).toFixed(2)}°.`:(eP<0?`Needs ${Math.abs(eP).toFixed(2)}° more pitch.`:`${eP.toFixed(2)}° too steep.`);
  if(Math.abs(got)<0.35*Math.abs(need))
    return {ok:false,t:`${head}<br>${lockTxt}<br><b class="far">${axis[0].toUpperCase()+axis.slice(1)} can't be adjusted with that leg locked.</b> <span class="mut" style="font-weight:400">Free the leg or replace its leveler, or skip this step and accept the reading.</span>`};
  const mv=LEGS.filter(k=>!L.includes(k)&&Math.abs(pl.d[k])>=0.004);
  const lines=mv.map(k=>{const d=pl.d[k], g=turnsIn(Math.abs(d),p.tpi);
    return `<li>${LEGN[k]} leg's leveler bolt: <b>${d>0?T().cw:T().ccw} ≈ ${g.txt} turn${g.t>1.1?"s":""}</b> <span class="mut" style="font-weight:400">(${d>0?"raises":"lowers"} that corner)</span></li>`}).join("");
  const side=Math.abs(other)>0.003?`<br><span class="near" style="font-weight:400">This also shifts ${roll?"pitch":"roll"} by about ${(Math.atan(other/oSpan)/D).toFixed(2)}° because of the locked leg.</span>`:"";
  const part=Math.abs(got)<0.95*Math.abs(need)?`<br><span class="near" style="font-weight:400">Only part of the correction is possible with that leg locked.</span>`:"";
  return {ok:false,t:`${head}<br>${lockTxt}<ul style="margin:4px 0;padding-left:20px">${lines}</ul><span class="mut" style="font-weight:400"><b>Do every leg listed</b>: moving only one of them may not change the reading. Looking down at the wrench. Turn the bolts, not the jam nuts. Left/right as you stand at the front.</span>${side}${part}`};
}

/* ---------- leg response test: does this leg's leveler actually move the machine? ---------- */
// Turn one leg a known number of full turns and compare the measured tilt change with what the geometry predicts.
let legT=null; // {leg,turns,phase:"ready"|"base"|"turn"|"meas"|"done",base,end,res}
let LEGT_MS=1500;
const collectLive=ms=>new Promise(res=>{const a=[],iv=setInterval(()=>a.push(liveRaw()),50);setTimeout(()=>{clearInterval(iv);res(a)},ms)});
function legExpected(p,k,n){const h=n/p.tpi; return {p:Math.atan(BP[k]*h/(2*p.spanFB))/D, r:Math.atan(BR[k]*h/(2*p.spanLR))/D}}
function legResult(){
  const p=prof(), t=legT, e=legExpected(p,t.leg,t.turns), m={p:t.end.p-t.base.p,r:t.end.r-t.base.r};
  const ee=e.p*e.p+e.r*e.r;
  return {e,m,s:(m.p*e.p+m.r*e.r)/ee, small:Math.sqrt(ee)<0.05};
}
async function startLegTest(){
  await startSensors();
  legT.phase="base"; legT.res=null; render();
  const a=await collectLive(LEGT_MS); legT.base={p:meanOf(a,"p"),r:meanOf(a,"r")}; legT.phase="turn"; render();
}
async function finishLegTest(){
  legT.phase="meas"; render();
  const a=await collectLive(LEGT_MS); legT.end={p:meanOf(a,"p"),r:meanOf(a,"r")}; legT.res=legResult(); legT.phase="done"; render();
}
function viewLegTest(){
  const p=prof(), t=legT, k=t.leg, e=legExpected(p,k,t.turns), nm=LEGN[k];
  let body="";
  if(t.phase==="ready") body=`<p class="mut">This checks whether turning the <b>${nm}</b> leg's leveler bolt really moves the machine. Lay the phone flat on the playfield and <b>leave it there</b> for the whole test.</p>
    <label>Full turns to test<input id="ltTurns" type="number" min="1" max="8" step="1" value="${t.turns}"></label>
    <p class="mut">Expected change: pitch ${f2(e.p)}°, roll ${f2(e.r)}° (${t.turns} turn${t.turns>1?"s":""} raising that corner).</p>
    <div class="row"><button id="ltCancel">Cancel</button><button class="pri" id="ltStart" ${(raw.has||sim)?"":"disabled"}>Start</button></div>
    ${(raw.has||sim)?"":`<p class="near">No motion data yet. Start the sensor from the Setup screen first.</p>`}`;
  else if(t.phase==="base"||t.phase==="meas") body=`<p><b>Hold still…</b> measuring the ${t.phase==="base"?"starting level":"new level"}.</p>`;
  else if(t.phase==="turn") body=`<p>Now turn the <b>${nm}</b> leg's leveler bolt <b>${T().cw} ${t.turns} full turn${t.turns>1?"s":""}</b> (looking down at the wrench; this raises that corner). <b>Don't move the phone.</b></p>
    <p class="mut">If the bolt just spins or the threads feel stripped, stop; don't force it. Tap Done either way.</p><button class="pri" id="ltDone" style="width:100%">Done turning</button>`;
  else{
    const r=t.res, pct=Math.round(r.s*100), nums=`<p class="mut">Expected pitch ${f2(r.e.p)}°, roll ${f2(r.e.r)}°. Measured pitch ${f2(r.m.p)}°, roll ${f2(r.m.r)}°.</p>`;
    const lockBtn=(p.locked||[]).includes(k)?`<span class="mut">Already marked locked.</span>`:`<button class="pri" id="ltLock">Mark ${nm} as can't adjust</button>`;
    body=(r.small?`<p class="near"><b>Too small to measure.</b> Use more turns and test again.</p>`
      :r.s>=0.5?`<p class="good"><b>✅ This leg responds</b> (${pct}% of the expected change). It's adjustable.</p>`
      :r.s>=0.2?`<p class="near"><b>⚠ Weak response</b> (${pct}% of expected). It may be slipping, or the cabinet is flexing. Try more turns, or treat it as stuck.</p>${lockBtn}`
      :r.s>-0.3?`<p class="far"><b>❌ No real response</b> (${pct}% of expected). This leg looks stuck or stripped.</p>${lockBtn}`
      :`<p class="far"><b>↩ The machine tilted the OPPOSITE way</b> (${pct}%). That isn't a stuck leg: either clockwise/counterclockwise is swapped for your levelers, or a sensor axis is reversed.</p>
        <p class="mut">If the corner you turned physically went the opposite way to what the step said, swap the wording and test again. If you haven't checked the sensor yet, run the Sensor test sign check first.</p>
        <button class="pri" id="ltSwap">Swap clockwise / counterclockwise${opts.revTurn?" (currently swapped)":""}</button>`)
      +nums+`<div class="row" style="margin-top:8px"><button id="ltAgain">Test again</button><button id="ltBack">Back to Setup</button></div>`;
  }
  return `<div class="card"><h2>Leg test: ${nm}</h2>${body}</div>`;
}
function bindLegs(){
  document.querySelectorAll("[data-leg]").forEach(b=>b.onclick=()=>{
    const p=prof(), k=b.dataset.leg, s=new Set(p.locked||[]); s.has(k)?s.delete(k):s.add(k);
    p.locked=LEGS.filter(x=>s.has(x)); persist(); render()});
  document.querySelectorAll("[data-legtest]").forEach(b=>b.onclick=()=>{legT={leg:b.dataset.legtest,turns:3,phase:"ready"};render()});
  const ax=$("#axSel"); if(ax)ax.onchange=()=>{prof().axes=ax.value;persist();render()};
  const tn=$("#ltTurns"); if(tn)tn.onchange=()=>{legT.turns=Math.max(1,Math.min(8,parseInt(tn.value)||3));render()};
  const st=$("#ltStart"); if(st)st.onclick=startLegTest;
  const dn=$("#ltDone"); if(dn)dn.onclick=finishLegTest;
  const cn=$("#ltCancel"); if(cn)cn.onclick=()=>{legT=null;render()};
  const sw=$("#ltSwap"); if(sw)sw.onclick=()=>{opts.revTurn=!opts.revTurn;persist();legT.phase="ready";legT.res=null;render()};
  const ag=$("#ltAgain"); if(ag)ag.onclick=()=>{legT.phase="ready";legT.res=null;render()};
  const bk=$("#ltBack"); if(bk)bk.onclick=()=>{legT=null;render()};
  const lk=$("#ltLock"); if(lk)lk.onclick=()=>{const p=prof();p.locked=LEGS.filter(x=>x===legT.leg||(p.locked||[]).includes(x));persist();legT=null;render()};
}

/* ---------- sensor test ---------- */
// Validates a real phone: event rate + noise, beta/gamma sign convention, accuracy vs a known wedge.
// All numbers here are UNCALIBRATED raw readings (calibration offset not applied).
let tst=null; // {busy,noise,flat,top,right,known,wA,wB} while the test screen is open
const TEST_MS={noise:10000,sign:1500,wedge:3000};
const evRate=()=>evT.length>1?(evT.length-1)/((evT[evT.length-1]-evT[0])/1000):0;
const collect=(ms)=>new Promise(res=>{const a=[],iv=setInterval(()=>a.push({p:rawLast.p,r:rawLast.r}),50);setTimeout(()=>{clearInterval(iv);res(a)},ms)});
const meanOf=(a,k)=>a.reduce((s,x)=>s+x[k],0)/(a.length||1);
function noiseStats(a){
  const W=30, rs=[]; // sliding 1.5 s windows (30 samples at 50 ms)
  for(let i=0;i+W<=a.length;i+=5){const w=a.slice(i,i+W), rg=k=>Math.max(...w.map(x=>x[k]))-Math.min(...w.map(x=>x[k]));rs.push(Math.max(rg("p"),rg("r")))}
  rs.sort((x,y)=>x-y);
  const sd=k=>{const m=meanOf(a,k);return Math.sqrt(a.reduce((s,x)=>s+(x[k]-m)**2,0)/(a.length||1))};
  const p90=rs.length?rs[Math.min(rs.length-1,Math.floor(rs.length*0.9))]:0;
  // smallest strictness whose threshold leaves 25% headroom over the typical (p90) still-window range
  const rec=["strict","normal","relaxed"].find(k=>p90<=THR[k]*0.8)||null;
  return {p90,sdP:sd("p"),sdR:sd("r"),n:a.length,hz:evRate(),rec};
}
// exp = the direction the app expects the reading to move: +1 rises, -1 falls
function signVerdict(d,name,exp=1){
  if(Math.abs(d)<0.5)return `too small to tell (Δ${f2(d)}°, prop it up more)`;
  const how=d>0?"increased":"decreased";
  return (d>0)===(exp>0)?`OK: ${name} ${how} (Δ${f2(d)}°), matches the app`:`FLIPPED: ${name} ${how} (Δ${f2(d)}°), opposite of the app's assumption`;
}
// From the raw (unsigned) sign check: which axes need reversing. null until at least one axis is measured clearly.
function signFix(t){
  const dP=t.flat&&t.top?t.top.p-t.flat.p:0, dR=t.flat&&t.right?t.right.r-t.flat.r:0;
  const okP=Math.abs(dP)>=0.5, okR=Math.abs(dR)>=0.5; if(!okP&&!okR)return null;
  const revP=okP?dP<0:opts.revP, revR=okR?dR>0:opts.revR; // raising the TOP edge should raise beta; raising the RIGHT edge should lower gamma
  return {revP,revR,text:`Pitch will be ${revP?"reversed":"normal"}, roll ${revR?"reversed":"normal"}.`};
}
function wedgeStats(t){
  if(!t.wA||!t.wB)return null;
  const meas=(t.wA.p-t.wB.p)/2, offP=(t.wA.p+t.wB.p)/2, offR=(t.wA.r+t.wB.r)/2, err=meas-t.known;
  return {meas,offP,offR,err,verdict:Math.abs(err)<=0.1?"good":Math.abs(err)<=0.25?"okay":"poor"};
}
function testText(){
  const t=tst, L=[`Pin Leveler sensor test, v${VERSION} (${BUILD_DATE})`,navigator.userAgent];
  L.push(`Event rate: ${evRate().toFixed(0)} Hz`);
  if(t.noise)L.push(`Noise at rest (${TEST_MS.noise/1000} s): worst-case 1.5 s range (p90) ${t.noise.p90.toFixed(3)}°, std dev pitch ${t.noise.sdP.toFixed(3)}° roll ${t.noise.sdR.toFixed(3)}°, suggested strictness: ${t.noise.rec||"none (too noisy)"}`);
  if(t.flat&&t.top)L.push(`Sign, pitch: ${signVerdict(t.top.p-t.flat.p,"beta")}`);
  if(t.flat&&t.right)L.push(`Sign, roll (right edge raised): ${signVerdict(t.right.r-t.flat.r,"gamma",-1)}`);
  const w=wedgeStats(t); if(w)L.push(`Wedge ${t.known}°: measured ${w.meas.toFixed(2)}° (error ${f2(w.err)}°, ${w.verdict}); sensor offset pitch ${f2(w.offP)}° roll ${f2(w.offR)}°`);
  return L.join("\n");
}
function viewTest(){
  const t=tst, ok=raw.has, dis=(!ok||t.busy)?"disabled":"";
  const btn=(id,label,c="")=>`<button id="${id}" class="${c}" ${dis}>${t.busy===id?"Hold still…":label}</button>`;
  const n=t.noise, w=wedgeStats(t);
  return `<div class="card"><h2>Sensor test</h2>
  <p class="mut">Checks this phone's sensor. Do it on a hard, flat surface; the readings here are raw (calibration is not applied). Copy the results at the bottom.</p>
  ${ok?"":`<p class="near"><b>No motion data from this phone.</b></p><button class="pri retrySens">Retry sensors</button>${diagHtml()}`}
  <div class="guide" id="tLive" style="min-height:0"></div></div>
  <div class="card"><h2>1. Noise at rest</h2>
  <p class="mut">Lay the phone flat and keep it still for ${TEST_MS.noise/1000} s (nobody bumping the machine).</p>${btn("tNoise","Measure noise","pri")}
  ${n?`<p>Still-window range (p90): <b>${n.p90.toFixed(3)}°</b> · std dev pitch ${n.sdP.toFixed(3)}° roll ${n.sdR.toFixed(3)}° · ${n.hz.toFixed(0)} Hz<br>
  ${n.rec?`Suggested settle strictness: <b class="good">${n.rec}</b> ${opts.strict===n.rec?`<span class="mut">(already set)</span>`:`<button id="tApply" style="padding:4px 10px">Apply</button>`}`
    :`<b class="far">Too noisy for the strictest settings.</b> <span class="mut">Use Relaxed, check for vibration, or place the phone on something rigid.</span>`}</p>`:""}</div>
  <div class="card"><h2>2. Sign check</h2>
  <p class="mut">Do these in order, with the phone screen up. For B and C, prop that edge up about 2 cm (a book or a few coins), keep the phone still, and tap the button. "Top" is the end with the front camera; "right" is the right side as you look at the screen. The app assumes <b>top edge raised → beta rises</b> and <b>right edge raised → gamma falls</b>.</p>
  <div class="row">${btn("tFlat","A. Flat")}${btn("tTop","B. Top edge raised")}${btn("tRight","C. Right edge raised")}</div>
  <p class="mut">${t.flat?`Flat: beta ${t.flat.p.toFixed(2)}° gamma ${t.flat.r.toFixed(2)}°`:"Start with A."}</p>
  ${t.flat&&t.top?`<p>Pitch: ${esc(signVerdict(t.top.p-t.flat.p,"beta"))}</p>`:""}${t.flat&&t.right?`<p>Roll: ${esc(signVerdict(t.right.r-t.flat.r,"gamma",-1))}</p>`:""}
  ${signFix(t)?`<button id="tSignApply" class="pri">Apply measured signs</button> <span class="mut">${signFix(t).text}</span>`:""}${fixHtml()}</div>
  <div class="card"><h2>3. Accuracy vs a known wedge</h2>
  <p class="mut">Use a wedge or shim of known angle (measure it with a digital level). Put the phone on it with the top toward the <b>high</b> end and tap A, then rotate it 180° in the same spot and tap B. Averaging the two cancels the sensor's own offset.</p>
  <label>Known angle (°)<input id="tKnown" type="number" step="0.05" value="${t.known}"></label>
  <div class="row" style="margin-top:8px">${btn("tWA","A. Top toward high end")}${btn("tWB","B. Rotated 180°")}</div>
  ${w?`<p>Measured <b>${w.meas.toFixed(2)}°</b> vs known ${t.known}° → error <b class="${w.verdict==="good"?"good":w.verdict==="okay"?"near":"far"}">${f2(w.err)}°</b> (${w.verdict}).<br><span class="mut">Sensor offset: pitch ${f2(w.offP)}°, roll ${f2(w.offR)}°. Flip calibration removes it.</span></p>`:""}</div>
  <div class="card"><h2>Results</h2><textarea id="tOut" rows="7" readonly>${esc(testText())}</textarea>
  <div class="row" style="margin-top:8px"><button id="tCopy" class="pri">Copy results</button><button id="tClear">Clear</button><button id="tBack">Back</button></div></div>`;
}
function bindTest(){
  const run=(id,ms,fn)=>{const b=$("#"+id); if(b)b.onclick=async()=>{tst.busy=id;render();const a=await collect(ms);tst.busy="";fn(a);save("pl.test",tst);render()}};
  run("tNoise",TEST_MS.noise,a=>{tst.noise=noiseStats(a)});
  run("tFlat",TEST_MS.sign,a=>{tst.flat={p:meanOf(a,"p"),r:meanOf(a,"r")}});
  run("tTop",TEST_MS.sign,a=>{tst.top={p:meanOf(a,"p"),r:meanOf(a,"r")}});
  run("tRight",TEST_MS.sign,a=>{tst.right={p:meanOf(a,"p"),r:meanOf(a,"r")}});
  run("tWA",TEST_MS.wedge,a=>{tst.wA={p:meanOf(a,"p"),r:meanOf(a,"r")}});
  run("tWB",TEST_MS.wedge,a=>{tst.wB={p:meanOf(a,"p"),r:meanOf(a,"r")}});
  const sa=$("#tSignApply"); if(sa)sa.onclick=()=>{const f=signFix(tst);opts.revP=f.revP;opts.revR=f.revR;persist();render()};
  const ap=$("#tApply"); if(ap)ap.onclick=()=>{opts.strict=tst.noise.rec;persist();render()};
  const kn=$("#tKnown"); if(kn)kn.onchange=()=>{tst.known=parseFloat(kn.value)||0;save("pl.test",tst);render()};
  const cp=$("#tCopy"); if(cp)cp.onclick=async()=>{const o=$("#tOut");try{await navigator.clipboard.writeText(o.value);cp.textContent="Copied ✔"}catch(e){o.select();cp.textContent="Select + copy manually"}};
  const cl=$("#tClear"); if(cl)cl.onclick=()=>{tst={busy:"",known:tst.known};save("pl.test",tst);render()};
  const bk=$("#tBack"); if(bk)bk.onclick=()=>{tst=null;render()};
}

function bind(){
  bindTest();
  document.querySelectorAll(".retrySens").forEach(b=>b.onclick=retrySensors);
  const tb=$("#testBtn"); if(tb)tb.onclick=async()=>{await startSensors();tst=Object.assign({busy:"",known:6.5},LS("pl.test")||{},{busy:""});render()};
  const hs=$("#hintSwap"); if(hs)hs.onclick=()=>{opts.revTurn=!opts.revTurn;persist();worseN=0;worseHint=false;trendHist=[];render()};
  const hn=$("#hintSensor"); if(hn)hn.onclick=async()=>{await startSensors();worseN=0;worseHint=false;tst=Object.assign({busy:"",known:6.5},LS("pl.test")||{},{busy:""});render()};
  const ho=$("#hintOff"); if(ho)ho.onclick=()=>{worseHint=false;worseN=-99;render()}; // dismissed: stay quiet until the step changes
  const go=n=>{worseN=0;worseHint=false;flow.on=false;if(n<=3)spots={};step=n;okSince=0;chimed=false;hold=0;saved=false;render()};
  const nx=$("#next"), bk=$("#back");
  if(nx)nx.onclick=()=>{ if(step===5)go(stepAfter(1)); else if(step===4)go(saved?5:stepAfter(1)); else go(stepAfter(step)) };
  if(bk)bk.onclick=()=>go(stepBefore(step));
  bindLegs();
  document.querySelectorAll(".axSel2").forEach(s=>s.onchange=()=>{
    prof().axes=s.value; persist(); worseN=0; worseHint=false; progKey="";
    // if the current step is no longer used, jump to the next one that is
    if(step>=2&&step<=3&&skipStep(step,prof())){go(step===2?3:2); return}
    render()});
  const sel=$("#profSel"); if(sel)sel.onchange=()=>{cur=sel.value;persist();render()};
  const st=$("#startBtn"); if(st)st.onclick=async()=>{await startSensors();go(1)};
  const ed=$("#editBtn"); if(ed)ed.onclick=()=>{const e=$("#editor");e.innerHTML=e.innerHTML?"":editorHtml();bindEditor()};
  const nw=$("#newBtn"); if(nw)nw.onclick=()=>{const q={...prof(),id:"u"+Date.now(),name:"New machine",notes:""};P.push(q);cur=q.id;persist();render();$("#editBtn").click()};
  const dp=$("#dupBtn"); if(dp)dp.onclick=()=>{const q={...prof(),id:"u"+Date.now(),name:prof().name+" (copy)"};P.push(q);cur=q.id;persist();render()};
  const dl=$("#delBtn"); if(dl)dl.onclick=()=>{if(confirm("Delete this profile?")){P=P.filter(x=>x.id!==cur);cur=P[0].id;persist();render()}};
  const ca=$("#capA"); if(ca)ca.onclick=async()=>{capturing=true;ca.textContent="Hold still…";calA=await sample(1500);calB=null;capturing=false;render()};
  const cb=$("#capB"); if(cb)cb.onclick=async()=>{capturing=true;cb.textContent="Hold still…";calB=await sample(1500);capturing=false;
    off={p:(calA.p+calB.p)/2,r:(calA.r+calB.r)/2};persist();
    const tilt=Math.max(Math.abs(calA.p-calB.p),Math.abs(calA.r-calB.r))/2;
    render(); $("#calStat").textContent+=` · offset saved. Surface tilt ≈ ${tilt.toFixed(2)}°`; };
  const cr=$("#calReset"); if(cr)cr.onclick=()=>{off={p:0,r:0};calA=calB=null;persist();render()};
  [["oFlip","flip"],["oBeep","beep"],["oSpeak","speak"],["oTrend","trend"],["oTick","tick"],["oRevP","revP"],["oRevR","revR"],["oRev","revTurn"]].forEach(([id,k])=>{const e=$("#"+id);
    if(e)e.onchange=()=>{opts[k]=e.checked;persist();if(/^rev/.test(k))render();
      // immediate feedback, and the tap also unlocks speech / audio on Android
      try{
        if(k==="speak"){ if(window.speechSynthesis)speechSynthesis.cancel(); if(e.checked)speak("Voice on") }
        else if(k==="beep"&&e.checked)tone([660,880])
        else if(k==="trend"&&e.checked)tone([523,659,784])
        else if(k==="tick"&&e.checked)tone([1000])
      }catch(err){}
    }});
  const fb=$("#fixBox"); if(fb)fb.ontoggle=()=>{fixOpen=fb.open};
  document.querySelectorAll("[data-spot]").forEach(btn=>btn.onclick=()=>flowStart(SPOTS.findIndex(s=>s[0]===btn.dataset.spot)));
  const fs=$("#flowStart"); if(fs)fs.onclick=()=>flowStart();
  const fn=$("#flowNow"); if(fn)fn.onclick=()=>{const m=recentMean(QUIET_MS);flowCapture(m.p,m.r)};
  const fm=$("#flowMoved"); if(fm)fm.onclick=flowMoved;
  const fp=$("#flowStop"); if(fp)fp.onclick=flowStop;
  const os=$("#oStrict"); if(os)os.onchange=()=>{opts.strict=os.value;persist()};
  const ll=$("#logLink"); if(ll)ll.onclick=e=>{e.preventDefault();showLog=!showLog;render()};
  const ul=$("#updLink"); if(ul)ul.onclick=e=>{e.preventDefault();checkUpdate()};
  const ud=$("#updDismiss"); if(ud)ud.onclick=()=>{showUpd=false;render()};
  bindUpd();
  const sp=$("#simP"),sr=$("#simR");
  if(sp)sp.oninput=()=>{sim.p=+sp.value;$("#sp").textContent=sim.p.toFixed(2)};
  if(sr)sr.oninput=()=>{sim.r=+sr.value;$("#sr").textContent=sim.r.toFixed(2)};
}
function bindEditor(){
  document.querySelectorAll("#editor [data-f]").forEach(el=>{
    el.onchange=()=>{const k=el.dataset.f,p=prof();p[k]=el.type==="number"||k==="tpi"?parseFloat(el.value)||0:el.value;persist();
      if(k==="name"){const o=$("#profSel option[value='"+cur+"']");if(o)o.textContent=p.name}}
  });
  document.querySelectorAll("#editor [data-tip]").forEach(el=>{el.onchange=()=>{const p=prof();p.tips=p.tips||{};p.tips[el.dataset.tip]=el.value.split("\n").map(x=>x.trim()).filter(Boolean);persist()}});
  const mt=$("#manualText"); if(mt)mt.oninput=()=>{
    const f=findAngles(mt.value);
    $("#found").innerHTML=f.length?`<p class="mut">Tap a value to use as target pitch:</p>`+f.map((x,i)=>`<span class="chip" data-i="${i}">${x.v}° <span class="mut">…${esc(x.ctx)}…</span></span>`).join(""):`<p class="mut">No angle values found.</p>`;
    $("#found").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const p=prof();p.pitch=f[c.dataset.i].v;
      p.notes=(p.notes?p.notes+" ":"")+"Pitch set from pasted manual text.";persist();render();$("#editBtn").click()});
  };
  const ex=$("#expBtn"); if(ex)ex.onclick=()=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:"application/json"}));a.download="pin-leveler-profiles.json";a.click()};
  const im=$("#impFile"); if(im)im.onchange=async()=>{try{const j=JSON.parse(await im.files[0].text());
    if(Array.isArray(j)){j.forEach(x=>{if(x&&x.name&&x.pitch){x.id="i"+Date.now()+Math.random().toString(36).slice(2,6);P.push(x)}});persist();render()}}catch(e){alert("Invalid file")}};
}

/* ---------- boot ---------- */
{ // remember the last-seen version; show an "Updated" card when it changed (or when upgrading from a pre-versioning build)
  const prev=LS("pl.ver");
  if(prev!==VERSION){ if(prev||hadSaved){showUpd=true;updFrom=prev||"earlier"} save("pl.ver",VERSION); }
}
(function loop(){ try{ if(step>=1||tst)update() }catch(e){ const d=$("#dbg"); if(d)d.textContent="Display error (still running): "+(e&&e.message) } requestAnimationFrame(loop) })();
if("serviceWorker" in navigator && location.protocol==="https:"){ /* optional: add sw.js for offline */ }
// Android Chrome grants sensors without a prompt; start early if allowed.
if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission!=="function"){startSensors()}
render();
</script>
